<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Frontend...</title>
    
    <!-- Instant redirect using meta refresh (0 seconds delay) -->
    <meta http-equiv="refresh" content="0; url=frontend/index.html">
    
    <!-- Fallback JavaScript redirect -->
    <script>
        window.location.replace("frontend/index.html");
    </script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #ff0000, #cc0000);
            color: white;
            text-align: center;
        }
        .container {
            max-width: 400px;
            padding: 2rem;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .manual-link {
            display: inline-block;
            margin-top: 1rem;
            color: white;
            text-decoration: underline;
            cursor: pointer;
        }
        .manual-link:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>Redirecting to Frontend...</h1>
        <p>You will be redirected automatically in a moment.</p>
        <a href="frontend/index.html" class="manual-link">
            Click here if you're not redirected automatically
        </a>
    </div>

    <!-- Additional JavaScript for immediate redirect -->
    <script>
        // Triple redundancy for instant redirect
        setTimeout(function() {
            window.location.href = "frontend/index.html";
        }, 100);
        
        // Immediate redirect
        if (window.location.pathname === '/' || window.location.pathname === '/index.html') {
            window.location.replace("frontend/index.html");
        }
    </script>
</body>
</html>
