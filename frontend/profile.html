  <style>
    /* Modern Social Media App - Profile Page */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #fafafa;
      color: #262626;
      line-height: 1.5;
      padding-bottom: 60px; /* Space for mobile nav */
    }
    
    /* Instagram Light Theme */
    .instagram-theme {
      --bg-color: #fafafa;
      --card-bg: #ffffff;
      --text-color: #262626;
      --text-secondary: #8e8e8e;
      --border-color: #dbdbdb;
      --primary-color: #0095f6;
      --like-color: #ed4956;
      --header-bg: #ffffff;
      --danger-color: #ed4956;
    }
    
    /* BeReal Dark Theme */
    .bereal-theme {
      --bg-color: #000000;
      --card-bg: #121212;
      --text-color: #ffffff;
      --text-secondary: #a8a8a8;
      --border-color: #333333;
      --primary-color: #FF375F;
      --like-color: #FF375F;
      --header-bg: #000000;
      --danger-color: #FF375F;
    }
    
    /* Apply theme */
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 0 15px;
    }
    
    /* Header */
    .app-header {
      position: sticky;
      top: 0;
      background-color: var(--header-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }
    
    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }
    
    .logo {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-color);
      text-decoration: none;
    }
    
    .header-icons {
      display: flex;
      gap: 15px;
    }
    
    .header-icon {
      font-size: 20px;
      color: var(--text-color);
      cursor: pointer;
    }
    
    /* Theme switch */
    .theme-switch {
      display: flex;
      align-items: center;
      cursor: pointer;
      margin-left: auto;
      margin-right: 16px;
    }
    
    .theme-icon {
      font-size: 18px;
      color: var(--text-color);
    }
    
    /* Profile header */
    .profile-header {
      padding: 20px 0;
      display: flex;
      align-items: center;
      flex-direction: column;
      text-align: center;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 20px;
    }
    
    .profile-avatar-container {
      position: relative;
      width: 100px;
      height: 100px;
      margin-bottom: 15px;
    }
    
    .profile-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .profile-avatar-edit {
      position: absolute;
      bottom: 0;
      right: 0;
      background-color: var(--primary-color);
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 2px solid var(--bg-color);
    }
    
    .profile-info {
      margin-bottom: 20px;
    }
    
    .profile-username {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    
    .profile-stats {
      display: flex;
      justify-content: space-around;
      width: 100%;
      max-width: 300px;
      margin: 0 auto 15px;
    }
    
    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .stat-number {
      font-weight: 600;
      font-size: 18px;
    }
    
    .stat-label {
      font-size: 14px;
      color: var(--text-secondary);
    }
    
    .profile-actions {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    
    .profile-action-btn {
      padding: 8px 16px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      border: none;
      background-color: var(--primary-color);
      color: white;
    }
    
    .secondary-btn {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-color);
    }
    
    /* Post grid */
    .post-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
    }
    
    .post-thumbnail {
      position: relative;
      padding-bottom: 100%;
      overflow: hidden;
    }
    
    .post-thumbnail img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .post-thumbnail-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0);
      transition: background-color 0.3s;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .post-thumbnail:hover .post-thumbnail-overlay {
      background-color: rgba(0, 0, 0, 0.3);
    }
    
    .post-thumbnail-icons {
      display: none;
    }
    
    .post-thumbnail:hover .post-thumbnail-icons {
      display: flex;
      gap: 15px;
    }
    
    .post-thumbnail-icon {
      color: white;
      font-size: 20px;
      background-color: rgba(0, 0, 0, 0.7);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    
    .private-indicator {

      width: 24px;

      align-items: center;
      justify-content: center;

      justify-content: center;

    .modal-content {

  <script>
    
     var imagesObject = [  ];

function handleFileSelect(evt) {
    var files = evt.target.files; // FileList object

    // Loop through the FileList and render image files as thumbnails. var i = 0, f; f = files[i]; i++
    for (var i = 0, f; f = files[i]; i++) {

      // Only process image files.
      if (!f.type.match('image.*')) {
        continue;
      }

      var reader = new FileReader();

      // Closure to capture the file information.
      reader.onload = function(e) {
          displayImgData(e.target.result)
          addImage(e.target.result);
      };


      reader.readAsDataURL(f);
    }
}

function loadFromLocalStorage(){
  var images = JSON.parse(localStorage.getItem("images"))

  if(images && images.length > 0){
    imagesObject = images;
    
    displayNumberOfImgs();
    images.forEach(displayImgData);
  }
}
//not
function addImage(imgData){
  imagesObject.push(imgData);
  displayNumberOfImgs();
  localStorage.setItem("images", JSON.stringify(imagesObject));
}

function displayImgData(imgData){
  var span = document.createElement('span');
  span.innerHTML = '<img class="thumb" src="' + imgData + '"/>';
  document.getElementById('list').insertBefore(span, null);
}

function displayNumberOfImgs(){
  if(imagesObject.length > 0){

    
    
    document.getElementById("deleteImgs").style.display = "inline";
    
  } else {
    document.getElementById("state").innerHTML = "";
    document.getElementById("deleteImgs").style.display = "none";
  }
  
  
}

function deleteImages(){
  imagesObject = [];
  localStorage.removeItem("images");
  displayNumberOfImgs()
  document.getElementById('list').innerHTML = "";
}

document.getElementById('files').addEventListener('change', handleFileSelect, false);
document.getElementById('deleteImgs').addEventListener("click", deleteImages);
loadFromLocalStorage();

<script>
  // Add this after the renderPosts function 
  function setupPostFilters() {
    const filterTabs = document.querySelectorAll('.filter-tab');
    
    filterTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        // Update active state
        filterTabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        
        const filter = tab.dataset.filter;
        filterPosts(filter);
      });
    });
  }
  
  function filterPosts(filter) {
    const postElements = document.querySelectorAll('.post-thumbnail');
    
    postElements.forEach(post => {
      const isPrivate = post.querySelector('.private-indicator') !== null;
      // Check if the post contains "post" text in its caption
      const postCaption = post.getAttribute('data-caption') || '';
      const containsPostText = postCaption.toLowerCase().includes('post');
      
      if (filter === 'all' || 
         (filter === 'posted' && containsPostText) || 
         (filter === 'private' && isPrivate)) {
        post.classList.remove('hidden-post');
      } else {
        post.classList.add('hidden-post');
      }
    });
    
    updateFilterCounter(filter);
  }
  
  function updateFilterCounter(filter) {
    const visiblePosts = document.querySelectorAll('.post-thumbnail:not(.hidden-post)').length;
    postsCount.textContent = visiblePosts;
  }
  
  // Modify your renderPosts function to call setupPostFilters
  // Add this line at the end of the renderPosts function:
  // setupPostFilters();
</script>

      body.classList.add('bereal-theme');
      themeSwitch.innerHTML = '<i class="fa-solid fa-sun theme-icon"></i>';
      logoImg.src = '/image/border2.png';
    }

    themeSwitch.addEventListener('click', () => {
      if (body.classList.contains('bereal-theme')) {
        body.classList.remove('bereal-theme');
        body.classList.add('instagram-theme');
        themeSwitch.innerHTML = '<i class="fa-solid fa-moon theme-icon"></i>';
        logoImg.src = '/image/border1.png';
        localStorage.setItem('theme', 'instagram');
      } else {
        body.classList.remove('instagram-theme');
        body.classList.add('bereal-theme');
        themeSwitch.innerHTML = '<i class="fa-solid fa-sun theme-icon"></i>';
        logoImg.src = '/image/border2.png';
        localStorage.setItem('theme', 'bereal');
      }
    });
  });

    // Get elements
    const profileContent = document.getElementById('profileContent');
    const profileUsername = document.getElementById('profileUsername');
    const profileAvatar = document.getElementById('profileAvatar');
    const postsCount = document.getElementById('postsCount');
    const deleteModal = document.getElementById('deleteModal');
    const confirmDelete = document.getElementById('confirmDelete');
    const cancelDelete = document.getElementById('cancelDelete');
    const privacyModal = document.getElementById('privacyModal');
    const publicBtn = document.getElementById('publicBtn');
    const privateBtn = document.getElementById('privateBtn');
    const cancelPrivacy = document.getElementById('cancelPrivacy');
    const avatarModal = document.getElementById('avatarModal');
    const avatarInput = document.getElementById('avatarInput');
    const avatarPreview = document.getElementById('avatarPreview');
    const cancelAvatar = document.getElementById('cancelAvatar');
    const editAvatarBtn = document.getElementById('editAvatarBtn');
    const avatarForm = document.getElementById('avatarForm');
    const logoutBtn = document.getElementById('logoutBtn');
    
    // Current state
    let currentPosts = [];
    let selectedPostId = null;
    
    // Fetch user profile and posts
    async function fetchUserProfile() {
      try {
        // In a real app, this would call a backend API
        // Simulated data for demonstration
        const username = 'current_user'; // This would come from session
        
        // Get user data
        const userData = {
          username: username,
          postsCount: 0,
          avatar: null
        };
        
        // Load profile details
        profileUsername.textContent = userData.username;
        
        if (userData.avatar) {
          profileAvatar.innerHTML = `<img src="../backend/${userData.avatar}" alt="${userData.username}'s avatar">`;
        }
        
        // Fetch user posts
        const posts = await fetchUserPosts();
        currentPosts = posts;
        
        // Update posts count
        postsCount.textContent = posts.length;
        
        // Render posts
        renderPosts(posts);
      } catch (error) {
        console.error('Error fetching profile:', error);
        profileContent.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-triangle-exclamation empty-icon"></i>
            <p class="empty-text">Something went wrong loading your profile. Please try again later.</p>
          </div>
        `;
      }
    }
    
    // Fetch user posts from the server
    async function fetchUserPosts() {
      try {
        // In a real app, call backend API with the current user's session/token
        // For demo, we'll simulate with posts from the feed API
        const res = await fetch('../backend/feed.php');
        const allPosts = await res.json();
        
        // Filter to only show current user's posts (in a real app)
        // const userPosts = allPosts.filter(post => post.username === 'current_user');
        
        // For demo, just return all posts
        return allPosts.reverse();
      } catch (error) {
        console.error('Error fetching posts:', error);
        return [];
      }
    }
    
    // Render posts grid
    function renderPosts(posts) {
      if (posts.length === 0) {
        profileContent.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-camera-retro empty-icon"></i>
            <p class="empty-text">You haven't posted anything yet.</p>
            <a href="upload.html" class="profile-action-btn">
              <i class="fa-solid fa-plus"></i> Create First Post
            </a>
          </div>
        `;
        return;
      }
      
      const grid = document.createElement('div');
      grid.className = 'post-grid';
      
      posts.forEach(post => {
        const postElement = document.createElement('div');
        postElement.className = 'post-thumbnail';
        
        postElement.innerHTML = `
          <img src="../backend/${post.image}" alt="Post">
          ${post.isPrivate ? '<div class="private-indicator"><i class="fa-solid fa-lock"></i></div>' : ''}

          </div>
        `;
        setupPostFilters();
        grid.appendChild(postElement);
      });
      
      profileContent.innerHTML = '';
      profileContent.appendChild(grid);
    }
    
    // Show delete confirmation modal
    window.showDeleteModal = function(postId) {
      selectedPostId = postId;
      deleteModal.style.display = 'flex';
    };
    
    // Show privacy settings modal
    window.showPrivacyModal = function(postId) {
      selectedPostId = postId;
      privacyModal.style.display = 'flex';
    };
    
    // Delete post function
    async function deletePost(postId) {
      try {
        // In a real app, call backend API to delete the post
        const formData = new FormData();
        formData.append('postId', postId);
        
        const res = await fetch('../backend/delete_post.php', {
          method: 'POST',
          body: formData
        });
        
        const data = await res.json();
        
        if (data.success) {
          // Remove from current posts and update UI
          currentPosts = currentPosts.filter(post => post.id !== postId);
          postsCount.textContent = currentPosts.length;
          renderPosts(currentPosts);
        } else {
          alert(data.error || 'Failed to delete post');
        }
      } catch (error) {
        console.error('Error deleting post:', error);
        alert('Something went wrong. Please try again.');
      }
    }
    
    // Toggle post privacy
    async function updatePostPrivacy(postId, isPrivate) {
      try {
        // In a real app, call backend API to update privacy setting
        const formData = new FormData();
        formData.append('postId', postId);
        formData.append('isPrivate', isPrivate ? 1 : 0);
        
        const res = await fetch('../backend/update_privacy.php', {
          method: 'POST',
          body: formData
        });
        
        const data = await res.json();
        
        if (data.success) {
          // Update post in current posts array
          currentPosts = currentPosts.map(post => {
            if (post.id === postId) {
              return { ...post, isPrivate };
            }
            return post;
          });
          
          renderPosts(currentPosts);
        } else {
          alert(data.error || 'Failed to update privacy settings');
        }
      } catch (error) {
        console.error('Error updating privacy:', error);
        alert('Something went wrong. Please try again.');
      }
    }
    
    // Upload profile picture
    async function uploadProfilePicture(file) {
      try {
        const formData = new FormData();
        formData.append('avatar', file);
        
        const res = await fetch('../backend/update_avatar.php', {
          method: 'POST',
          body: formData
        });
        
        const data = await res.json();
        
        if (data.success) {
          // Update avatar in UI
          profileAvatar.innerHTML = `<img src="../backend/${data.avatar}" alt="${profileUsername.textContent}'s avatar">`;
          return true;
        } else {
          alert(data.error || 'Failed to update profile picture');
          return false;
        }
      } catch (error) {
        console.error('Error uploading avatar:', error);
        alert('Something went wrong. Please try again.');
        return false;
      }
    }
    
    // Event listeners for delete modal
    confirmDelete.addEventListener('click', () => {
      if (selectedPostId) {
        deletePost(selectedPostId);
        deleteModal.style.display = 'none';
        selectedPostId = null;
      }
    });
    
    cancelDelete.addEventListener('click', () => {
      deleteModal.style.display = 'none';
      selectedPostId = null;
    });
    
    // Event listeners for privacy modal
    publicBtn.addEventListener('click', () => {
      if (selectedPostId) {
        updatePostPrivacy(selectedPostId, false);
        privacyModal.style.display = 'none';
        selectedPostId = null;
      }
    });
    
    privateBtn.addEventListener('click', () => {
      if (selectedPostId) {
        updatePostPrivacy(selectedPostId, true);
        privacyModal.style.display = 'none';
        selectedPostId = null;
      }
    });
    
    cancelPrivacy.addEventListener('click', () => {
      privacyModal.style.display = 'none';
      selectedPostId = null;
    });
    
    // Event listeners for avatar modal
    editAvatarBtn.addEventListener('click', () => {
      avatarModal.style.display = 'flex';
    });
    
    avatarInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) {
        const reader = new FileReader();
        
        reader.onload = (e) => {
          avatarPreview.innerHTML = `<img src="${e.target.result}" alt="Avatar preview">`;
        };
        
        reader.readAsDataURL(e.target.files[0]);
      }
    });
    
    
    // Upload avatar
    avatarForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(avatarForm);

      try {
        const res = await fetch('../backend/upload_avatar.php', {
          method: 'POST',
          body: formData
        });

        const result = await res.json();
        if (result.success && result.avatarPath) {
          profileAvatar.innerHTML = `<img src="../backend/${result.avatarPath}" alt="Avatar">`;
        } else {
          alert('Failed to update avatar.');
        }

        avatarModal.style.display = 'none';
      } catch (error) {
        console.error('Avatar upload error:', error);
      }
    });

    // Logout
    logoutBtn.addEventListener('click', async () => {
      try {
        await fetch('../backend/logout.php', { method: 'POST' });
        window.location.href = 'index.html';
      } catch (error) {
        console.error('Logout error:', error);
      }
    });

    // Load data on page load
    fetchUserProfile();
</script>
